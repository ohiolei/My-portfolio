<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f142a" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Luxury Glass Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="2" />
  
  <!-- Subtle Internal Grid Line -->
  <path d="M12 48 L52 48" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- Monogram 'O' Ring -->
  <rect x="13" y="19" width="17" height="26" rx="8" fill="none" stroke="url(#brandGrad)" stroke-width="4.5" />
  
  <!-- Monogram 'W' Geometry -->
  <path d="M33 19 L38 42 L42.5 28 L47 42 L52 19" fill="none" stroke="url(#brandGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Live Beacon Dot -->
  <circle cx="51" cy="13" r="4.5" fill="#06b6d4" opacity="0.6" filter="url(#beaconGlow)" />
  <circle cx="51" cy="13" r="3.5" fill="#06b6d4" />
  <circle cx="51" cy="13" r="1.5" fill="#ffffff" />
</svg>